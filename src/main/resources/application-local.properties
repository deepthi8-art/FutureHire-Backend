spring.datasource.url=jdbc:h2:mem:futurehire_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
futurehire.jwt.secret=${JWT_SECRET:local-development-only-secret-not-for-production-1234}
futurehire.jwt.expiration-ms=86400000
futurehire.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
futurehire.seed-demo-users=true
futurehire.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
futurehire.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
futurehire.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:FutureHire Administrator}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB