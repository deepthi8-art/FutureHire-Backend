spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
futurehire.jwt.secret=${JWT_SECRET}
futurehire.jwt.expiration-ms=86400000
futurehire.cors.allowed-origins=${CORS_ORIGINS:https://*.vercel.app,https://futurehire-frontend.vercel.app,http://localhost:3000,http://localhost:5173}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
futurehire.seed-demo-users=false
futurehire.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
futurehire.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
futurehire.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:FutureHire Administrator}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB