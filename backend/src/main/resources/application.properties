# FutureHire Spring Boot Backend Application Properties

# Port — Render injects PORT env var automatically
server.port=${PORT:8081}

# MySQL Database Configuration — supports both Render and Railway env var names
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/futurehire_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload Limits (Resumes & Resources)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration — set JWT_SECRET in Render env vars
futurehire.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
futurehire.jwt.expiration-ms=86400000

# Swagger / OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration — allows Vercel frontend + local dev
futurehire.cors.allowed-origins=${CORS_ORIGINS:https://futurehire-frontend.vercel.app,http://localhost:3000,http://localhost:5173}

# Admin Bootstrap — set these in Render env vars to create admin user on startup
futurehire.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
futurehire.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
futurehire.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:FutureHire Administrator}

# Demo users seeding — keep false in production
futurehire.seed-demo-users=false
