# FutureHire Spring Boot Backend Application Properties

# Port - Railway injects PORT env var automatically
server.port=${PORT:8081}

# MySQL Database Configuration
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Multipart File Upload Limits (Resumes & Resources)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Configuration (override JWT_SECRET in Railway with a strong random value)
futurehire.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
futurehire.jwt.expiration-ms=86400000

# Swagger / OpenAPI Documentation Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Configuration - set CORS_ORIGINS in Railway to include your Vercel URL
# e.g. https://futurehire.vercel.app,http://localhost:3000
futurehire.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
