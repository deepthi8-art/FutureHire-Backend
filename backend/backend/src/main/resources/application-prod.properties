# ===============================
# Database Configuration (Aiven MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# JWT Configuration
# ===============================
futurehire.jwt.secret=${JWT_SECRET}
futurehire.jwt.expiration-ms=86400000

# ===============================
# CORS Configuration
# ===============================
futurehire.cors.allowed-origins=${CORS_ORIGINS}

# ===============================
# API Documentation
# ===============================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===============================
# Application Settings
# ===============================
futurehire.seed-demo-users=false
futurehire.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
futurehire.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
futurehire.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:FutureHire Administrator}

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# Diagnostic Logging
# ===============================
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
